services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
    environment:
      REDIS_ADDR: redis:6379
      HTTP_ADDR: :8080
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:8080"

volumes:
  redis-data:
